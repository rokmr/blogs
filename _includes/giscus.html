<!-- Giscus Comments & Reactions -->
<!--
  SETUP (one-time):
  1. Go to https://github.com/rokmr/blogs/settings → Features → enable "Discussions"
  2. In the Discussions tab, create a category called "Comments" (use Announcement format)
  3. Install the Giscus app: https://github.com/apps/giscus → grant access to rokmr/blogs
  4. Go to https://giscus.app/ → enter repo "rokmr/blogs" → select category "Comments"
  5. Copy the generated data-repo-id and data-category-id values below
-->
<div id="giscus-container">
    <script src="https://giscus.app/client.js"
        data-repo="rokmr/blogs"
        data-repo-id="R_kgDOQqldOA"
        data-category="Comments"
        data-category-id="DIC_kwDOQqldOM4C6qXj"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="1"
        data-input-position="top"
        data-theme="dark"
        data-lang="en"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
    </script>
</div>
